# Pulls the database connection string from Azure Key Vault (written there by Terraform)
# and syncs it into a Kubernetes Secret. ${...} values are filled in by the deploy pipeline
# from `terraform output`.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notes-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${KV_CSI_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
  secretObjects:
    - secretName: notes-db
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
