apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notes
resources:
  - namespace.yaml
  - secret-provider.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - network-policy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: notes
images:
  - name: notes-api
    newName: notes-api
    newTag: latest
  - name: notes-web
    newName: notes-web
    newTag: latest
