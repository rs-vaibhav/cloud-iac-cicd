apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: notes-web, port: { number: 80 } }
