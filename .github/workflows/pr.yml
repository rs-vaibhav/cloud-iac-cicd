# Runs on every pull request: nothing reaches main without tests, a clean plan and security scans.
name: pr-checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write        # OIDC login to Azure, no stored client secrets
  pull-requests: write   # post the terraform plan as a PR comment

env:
  TF_VERSION: 1.9.8
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  app:
    name: app - lint, test, build, scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest httpx ruff
      - run: ruff check .
      - run: pytest -q
      - name: Build images
        working-directory: .
        run: |
          docker build -t notes-api:${{ github.sha }} app/api
          docker build -t notes-web:${{ github.sha }} app/web
      - name: Scan API image for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: notes-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  k8s:
    name: kubernetes - render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render overlays and validate against the Kubernetes schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for env in dev prod; do
            kubectl kustomize k8s/overlays/$env > /tmp/$env.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas /tmp/$env.yaml
          done

  terraform:
    name: terraform - fmt, validate, lint, security, plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true          # report findings in the PR; tighten to false once the baseline is clean
          output_format: cli

      - name: Azure login (OIDC)
        if: env.ARM_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform plan (dev)
        id: plan
        if: env.ARM_CLIENT_ID != ''
        run: |
          terraform init -input=false -reconfigure -backend-config=envs/dev.backend.hcl
          terraform plan -input=false -no-color -var-file=envs/dev.tfvars -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const summary = plan.split('\n').filter(l => l.startsWith('Plan:') || l.startsWith('No changes')).join('\n');
            const body = `### Terraform plan (dev)\n**${summary}**\n<details><summary>Full plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
